<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="60%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#090514" />
    </radialGradient>

    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#7e22ce" />
      <stop offset="85%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Metallic Purple / Neon Violet Border Gradient -->
    <linearGradient id="neonPurpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="30%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Core Starburst / Diamond Gradient -->
    <linearGradient id="coreStarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f3e8ff" />
      <stop offset="70%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Inner Facet Accent Gradient -->
    <linearGradient id="facetGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="facetGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#d8b4fe" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Outer Circular Base -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#neonPurpleBorder)" stroke-width="2" />

  <!-- Geometric Cosmic Ring Orbit -->
  <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(-25 32 32)" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="3 2" opacity="0.4" />
  
  <!-- Outer Superhero Shield Emblem -->
  <path d="M 32 7 C 45 7 51 11 51 24 C 51 43 32 56 32 56 C 32 56 13 43 13 24 C 13 11 19 7 32 7 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#neonPurpleBorder)" 
        stroke-width="1.8" 
        filter="url(#purpleGlow)" />

  <!-- Shield Left Facet Shade -->
  <path d="M 32 8 C 21 8 15 12 15 24 C 15 41 32 54 32 54 L 32 8 Z" 
        fill="url(#facetGradLeft)" />

  <!-- Shield Right Facet Shade -->
  <path d="M 32 8 C 43 8 49 12 49 24 C 49 41 32 54 32 54 L 32 8 Z" 
        fill="url(#facetGradRight)" />

  <!-- Inner Angular Crest Border -->
  <path d="M 32 13 L 45 23 L 41 38 L 32 47 L 23 38 L 19 23 Z" 
        fill="#2e1065" 
        stroke="#e9d5ff" 
        stroke-width="1.2" 
        opacity="0.9" />

  <!-- Inner 4-Point Cosmic Star / Energy Crystal -->
  <!-- Top Ray -->
  <polygon points="32,15 34.5,27 32,29 29.5,27" fill="url(#coreStarGrad)" filter="url(#coreGlow)" />
  <!-- Bottom Ray -->
  <polygon points="32,45 34.5,33 32,31 29.5,33" fill="url(#coreStarGrad)" filter="url(#coreGlow)" />
  <!-- Left Ray -->
  <polygon points="19,30 29,28 30.5,30 29,32" fill="url(#coreStarGrad)" filter="url(#coreGlow)" />
  <!-- Right Ray -->
  <polygon points="45,30 35,28 33.5,30 35,32" fill="url(#coreStarGrad)" filter="url(#coreGlow)" />

  <!-- Diagonal Sub-Rays -->
  <polygon points="23,21 29.5,28 27.5,30" fill="#f3e8ff" opacity="0.8" />
  <polygon points="41,21 34.5,28 36.5,30" fill="#c084fc" opacity="0.8" />
  <polygon points="23,39 29.5,32 27.5,30" fill="#a855f7" opacity="0.8" />
  <polygon points="41,39 34.5,32 36.5,30" fill="#e9d5ff" opacity="0.8" />

  <!-- Central Radiant Diamond Core -->
  <polygon points="32,24 37,30 32,36 27,30" fill="#ffffff" stroke="#e9d5ff" stroke-width="0.8" filter="url(#coreGlow)" />
  <circle cx="32" cy="30" r="1.8" fill="#ffffff" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Shield/Hexagon Badge Background -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring/Bezel -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Shield Base -->
  <path d="M 32 8 C 44 8 50 12 50 24 C 50 42 32 54 32 54 C 32 54 14 42 14 24 C 14 12 20 8 32 8 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="1.75" 
        filter="url(#glow)" />

  <!-- Inner Arc Highlights -->
  <path d="M 32 12 C 41 12 45 15 45 24 C 45 37 32 48 32 48 C 32 48 19 37 19 24 C 19 15 23 12 32 12 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.2)" 
        stroke-width="1" />

  <!-- Center Star -->
  <polygon points="32,15 35.5,23 44,24 37.5,29.5 39.5,38 32,33.5 24.5,38 26.5,29.5 20,24 28.5,23" 
           fill="url(#goldGrad)" 
           stroke="#78350f" 
           stroke-width="0.75" 
           filter="url(#glow)" />

  <!-- Stylized "L" for Legendary (interlocking over the star) -->
  <path d="M 27 20 L 31 20 L 31 36 L 38 36 L 37 39 L 27 39 Z" 
        fill="#ffffff" 
        stroke="#0f172a" 
        stroke-width="0.75" />
</svg>
